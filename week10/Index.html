    nutrition figures on each oats card below, so no extra maths needed day to day.
  </div>

  <div class="section-title">🫒 Saturated fat approach</div>
  <div class="info-card">
    Olive oil is the default fat throughout; feta and cheese appear in small, deliberate amounts rather than as a base.
    Soluble fibre is boosted via ground flaxseed and chia in the oats, walnuts and pistachios in the salads, and
    the steady rotation of pulses and beans across lunches and dinners.
  </div>

  <div class="section-title">❄️ Defrost reminders</div>

    <b>Tuesday night:</b> move frozen blueberries to the fridge for Wednesday's oats.<br>
    <b>Wednesday night:</b> move frozen sweetcorn to the fridge for Wednesday's lunch and Thursday's dinner.<br>
    <b>Wednesday night:</b> move frozen mango to the fridge for Thursday's oats.
  </div>

    Strawberry &amp; Basil · Peach &amp; Almond · Blueberry &amp; Lemon · Mango &amp; Passionfruit · Raspberry &amp; Pistachio · Apricot &amp; Coconut

  </div>
`;

function shopItem(name, amt){
  return `<div class="shop-item" onclick="this.classList.toggle('checked'); saveShopping();">
    <div class="box"></div>
    <div class="label">${name} <span class="amt">— ${amt}</span></div>
  </div>`;
}
function saveShopping(){
  const states = Array.from(document.querySelectorAll('.shop-item')).map(el=>el.classList.contains('checked'));
  window.__shopState = states;
}
function resetShopping(){
  document.querySelectorAll('.shop-item').forEach(el=>el.classList.remove('checked'));
}

// ---------- Rendering ----------
function multiplierFor(day, mealKey){
  if(day.multiplier) return day.multiplier;
  if(mealKey==="breakfast") return day.breakfastMult;
  if(mealKey==="lunch") return day.lunchMult;
  if(mealKey==="dinner") return day.dinnerMult;
  return 1;
}

function mealCard(meal, mult){
  const multNote = mult===2 ? `<span style="color:var(--coral);font-weight:600;"> · ×2 today</span>` : "";
  return `
    <div class="meal-card">
      <div class="meal-head">
        <div class="meal-tag">${meal.tag}${multNote}</div>
        <div class="meal-title">${meal.title}</div>
        <div class="meal-kcal">${meal.kcal} kcal per serving</div>
      </div>
      <div class="meal-body">
        <div class="subsection">
          <h4>Ingredients ${mult===2 ? "(×2 quantities below)" : "(per serving)"}</h4>
          <ul class="ing-list">
            ${meal.ingredients.map(i=>`<li>${i}</li>`).join("")}
          </ul>
        </div>
        <div class="subsection">
          <h4>How to Make It</h4>
          <ol class="method-list">
            ${meal.method.map(s=>`<li>${s}</li>`).join("")}
          </ol>
        </div>
        <div class="subsection">
          <h4>Nutrition (per serving)</h4>
          <div class="nutri-grid">
            <div class="nutri-item"><div class="v">${meal.kcal}</div><div class="k">kcal</div></div>
            <div class="nutri-item"><div class="v">${meal.protein}g</div><div class="k">protein</div></div>
            <div class="nutri-item"><div class="v">${meal.fat}g</div><div class="k">fat</div></div>
            <div class="nutri-item"><div class="v">${meal.satFat}g</div><div class="k">sat fat</div></div>
            <div class="nutri-item"><div class="v">${meal.fibre}g</div><div class="k">fibre</div></div>
            <div class="nutri-item"><div class="v">${meal.carbs}g</div><div class="k">carbs</div></div>
          </div>
        </div>
        <div class="plant-points"><b>Plant points:</b> ${meal.plants.join(", ")}</div>
      </div>
    </div>
  `;
}

function dayPanel(day){
  if(day.bbqNote){
    const badge = `Breakfast ×${day.multiplier} · BBQ from lunch`;
    return `
      <div class="day-header">
        <h2>${day.full}</h2>
        <span class="serving-badge">${badge}</span>
      </div>
      ${mealCard(day.meals.breakfast, multiplierFor(day,"breakfast"))}
      <div class="info-card" style="text-align:center;">
        🔥 <b style="color:var(--text);">BBQ afternoon</b> — lunch and dinner are left open. Enjoy!
      </div>
    `;
  }
  const badge = day.multiplier ? `All meals ×${day.multiplier}` :
    `B/L ×${day.breakfastMult} · Dinner ×${day.dinnerMult}`;
  return `
    <div class="day-header">
      <h2>${day.full}</h2>
      <span class="serving-badge">${badge}</span>
    </div>
    ${mealCard(day.meals.breakfast, multiplierFor(day,"breakfast"))}
    ${mealCard(day.meals.lunch, multiplierFor(day,"lunch"))}
    ${mealCard(day.meals.dinner, multiplierFor(day,"dinner"))}
  `;
}

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");

DAYS.forEach(day=>{
  const btn = document.createElement("button");
  btn.textContent = day.label;
  btn.dataset.key = day.key;
  btn.onclick = ()=>showPanel(day.key);
  tabsEl.appendChild(btn);

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.id = "panel-"+day.key;
  if(day.key==="overview") panel.innerHTML = overviewHTML;
  else if(day.key==="shop") panel.innerHTML = shoppingHTML;
  else panel.innerHTML = dayPanel(day);
  mainEl.appendChild(panel);
});

function showPanel(key){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("panel-"+key).classList.add("active");
  document.querySelector(`nav.tabs button[data-key="${key}"]`).classList.add("active");
}
showPanel("overview");
</script>
