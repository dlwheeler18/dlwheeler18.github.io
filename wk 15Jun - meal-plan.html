  const toggleCheck = (key) => setChecked((p) => ({ ...p, [key]: !p[key] }));

  const totalItems = SHOPPING.flatMap((c) => c.items).length;
  const checkedCount = Object.values(checked).filter(Boolean).length;
  const totalPlants = DAYS.reduce((s, d) => s + (d.plants || 0), 0);

  const tagLabel = (t) => ({
    freezer: "🧊 freezer", leftover: "♻️ leftover", gut: "🌱 gut",
    quick: "⚡ quick", batch: "📦 batch", weekend: "✨ weekend",
    veg: "🥦 plant-based", lowsat: "❤️ low sat fat"
  }[t] || t);

  return (
    <div className="app">
      <style>{styles}</style>

      <div className="hero">
        <div className="hero-inner">
          <div className="hero-eyebrow">Gut Health · Low Sat Fat · Zero UPF</div>
          <div className="hero-title">Week <em>Three</em></div>
          <div className="hero-sub">7 days · ~1,662 kcal avg · {totalPlants}+ plant points · No red meat · Daily ferments</div>
          <div className="hero-stats">
            <div className="stat"><div className="stat-num">~1,662</div><div className="stat-label">Avg kcal</div></div>
            <div className="stat"><div className="stat-num">{totalPlants}+</div><div className="stat-label">Plant pts</div></div>
            <div className="stat"><div className="stat-num">0</div><div className="stat-label">Red meat</div></div>
            <div className="stat"><div className="stat-num">0</div><div className="stat-label">UPF</div></div>
          </div>
        </div>
      </div>

      <div className="sat-banner">
        <div style={{ fontSize: 20, flexShrink: 0, marginTop: 1 }}>🧊</div>
        <div>
          <div className="sat-banner-title">Sunday Evening — Defrost Before Week Starts</div>
          <div className="sat-banner-text">
            Move <strong>sliced bell peppers</strong> from freezer to fridge tonight — needed Monday lunch and dinner.
          </div>
        </div>
      </div>

      <div className="nav-tabs">
        {[["plan", "📅 Meal Plan"], ["shopping", "🛒 Shopping List"]].map(([t, label]) => (
          <button key={t} className={`nav-tab ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>{label}</button>
        ))}
      </div>

      {tab === "plan" && (
        <div className="week-grid">
          {DAYS.map((day) => {
            const isOpen = openDays[day.id];
            return (
              <div key={day.id} className="day-card">
                <div className="day-header" onClick={() => toggleDay(day.id)}>
                  <div className="day-header-left">
                    <div className="day-dot" style={{ background: day.dotBg, color: day.dotColor }}>
                      {day.name.slice(0, 2)}
                    </div>
                    <div>
                      <div className="day-name">{day.name}</div>
                      <div className="day-date">{day.date}</div>
                    </div>
                  </div>
                  <div className="day-meta">
                    {day.kcal && <div className="day-kcal">{day.kcal} kcal</div>}
                    <div className="day-serves">👤 {typeof day.serves === "number" ? `×${day.serves}` : day.serves}</div>
                    <div className={`day-chevron ${isOpen ? "open" : ""}`}>⌄</div>
                  </div>
                </div>

                {isOpen && day.nextDefrost && (
                  <div style={{ padding: "0 16px 10px" }}>
                    <div className="defrost-alert">{day.nextDefrost}</div>
                  </div>
                )}

                {isOpen && day.meals && (
                  <>
                    <div className="meals-grid">
                      {[
                        { key: "breakfast", label: "Breakfast", cls: "slot-b" },
                        { key: "lunch", label: "Lunch", cls: "slot-l" },
                        { key: "dinner", label: "Dinner", cls: "slot-d" },
                      ].map(({ key, label, cls }) => {
                        const meal = day.meals[key];
                        if (!meal) return null;
                        return (
                          <div key={key} className={`meal-slot ${cls}`}>
                            <div className="meal-slot-header">{label} · {meal.kcal} kcal</div>
                            <div className="meal-slot-body">
                              <div className="meal-name">{meal.name}</div>
                              <div className="meal-desc">{meal.desc}</div>
                              <div className="meal-tags">
                                {meal.tags.map((t) => (
                                  <span key={t} className={`tag tag-${t}`}>{tagLabel(t)}</span>
                                ))}
                              </div>
                              {meal.recipe && (
                                <button className="recipe-btn" onClick={() => setRecipe({ meal, day, slot: label })}>
                                  View recipe →
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div className="macros-row">
                      {Object.entries(day.macros).map(([k, v]) => (
                        <div key={k} className="macro-pill">{k}: {v}</div>
                      ))}
                      {day.plants && <div className="macro-pill">🌱 {day.plants} plants</div>}
                    </div>
                  </>
                )}
              </div>
            );
          })}
        </div>
      )}

      {tab === "shopping" && (
        <>
          <div className="progress-bar-wrap">
            <div className="progress-label">
              <span>Shopping progress</span>
              <span>{checkedCount} / {totalItems}</span>
            </div>
            <div className="progress-bg">
              <div className="progress-fill" style={{ width: `${totalItems ? (checkedCount / totalItems) * 100 : 0}%` }} />
            </div>
          </div>
          <div className="shopping-grid">
            {SHOPPING.map((cat) => {
              const isOpen = openCats[cat.cat] !== false;
              return (
                <div key={cat.cat} className="shop-cat">
                  <div className="shop-cat-header" onClick={() => toggleCat(cat.cat)}>
                    <span className="shop-cat-icon">{cat.icon}</span>
                    <span className="shop-cat-name">{cat.cat}</span>
                    <span className="shop-cat-count">{cat.items.length} items</span>
                    <span style={{ color: "#aabab8", marginLeft: 8 }}>{isOpen ? "⌄" : "›"}</span>
                  </div>
                  {isOpen && (
                    <div className="shop-items">
                      {cat.items.map((item) => {
                        const key = `${cat.cat}-${item.name}`;
                        const isChecked = checked[key];
                        return (
                          <div key={key} className="shop-item" onClick={() => toggleCheck(key)}>
                            <div className={`shop-check ${isChecked ? "checked" : ""}`}>
                              {isChecked && <span style={{ color: "#b8d8e0", fontSize: 11 }}>✓</span>}
                            </div>
                            <span className={`shop-item-name ${isChecked ? "checked" : ""}`}>{item.name}</span>
                            {item.freezer && <span className="shop-item-freezer">🧊 freezer</span>}
                            <span className="shop-item-qty">{item.qty}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}

      {recipe && (
        <div className="modal-overlay" onClick={() => setRecipe(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setRecipe(null)}>✕</button>
            <div className="modal-eyebrow">{recipe.day.name} · {recipe.slot}</div>
            <div className="modal-title">{recipe.meal.name}</div>
            <div className="modal-desc">{recipe.meal.desc}</div>
            <div className="modal-serves">👤 Serves {recipe.meal.serves}</div>
            <div className="modal-macro-row">
              <div className="modal-macro">⚡ {recipe.meal.kcal} kcal per person</div>
              {recipe.meal.tags.map((t) => (
                <span key={t} className={`tag tag-${t}`}>{tagLabel(t)}</span>
              ))}
            </div>
            <div className="modal-section-title">Ingredients</div>
            <ul className="ingredient-list">
              {recipe.meal.recipe.ingredients.map((ing, i) => (
                <li key={i} className="ingredient-item">
                  <span>{ing.name}</span>
                  <span className="ingredient-qty">{ing.qty}</span>
                </li>
              ))}
            </ul>
            <div className="modal-section-title">Method</div>
            <ul className="steps-list">
              {recipe.meal.recipe.steps.map((step, i) => (
                <li key={i} className="step-item">
                  <div className="step-num">{i + 1}</div>
                  <div className="step-text">{step}</div>
                </li>
              ))}
            </ul>
            {recipe.meal.recipe.note && (
              <div className="note-box">💡 {recipe.meal.recipe.note}</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MealPlanWeek3 />);
</script>
</body>
</html>
